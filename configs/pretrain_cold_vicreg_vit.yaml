name: cold_vicreg_vit
seed: 42
data:
  root: data/code15
views:
  amp: cold
  s_min: 0.5
  s_max: 2.0
  sigma_b: 0.5
  lam: 0.0
  rho: 0.0
  crop_min: 800
  crop_max: 1000
  shift_max: 50
  noise_std: 0.01
model:
  encoder: vit_tiny
  objective: vicreg
  objective_kwargs: {proj_dim: 768, proj_hidden: 768, sim_coeff: 25.0, std_coeff: 25.0, cov_coeff: 1.0}
optim:
  epochs: 50
  batch_size: 256
  blr: 1.5e-3
  wd: 0.05
  warmup: 5
